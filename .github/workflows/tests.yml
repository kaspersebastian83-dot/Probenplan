name: Automated tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Linux dependencies from Ubuntu HTTPS mirrors
        timeout-minutes: 10
        run: |
          # Avoid the Azure HTTP mirror that stalled package downloads on hosted runners.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          pnpm exec playwright install-deps chromium webkit
      - name: Install Playwright Chromium and WebKit
        timeout-minutes: 5
        run: pnpm exec playwright install chromium webkit
      - name: Production build
        run: pnpm build
      - name: Complete synthetic test suite (managed server)
        run: pnpm test
      - name: Upload failure reports, screenshots and Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probenplan-test-failures
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
